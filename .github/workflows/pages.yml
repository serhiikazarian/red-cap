name: Build, check and deploy

# Every push to main: build the single-file game, run the quick checks, publish it on GitHub Pages.
# Pull requests: the same build and checks, no deploy.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # the same versions the cloud sessions use (tools/ and tests/ load them from the global npm root; acorn comes with eslint)
      - name: Install checking tools
        run: |
          npm install -g eslint@10.1.0 prettier@3.8.1 playwright@1.63.0
          playwright install --with-deps chromium

      # the same checks as a session's tools/check.sh: format (check only), build, lint, unused names, boot
      - name: Build and check
        run: tools/check.sh ci

      - name: Prepare site
        run: |
          mkdir _site
          cp game/red-cap.html _site/index.html

      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # A version (a commit whose subject is exactly N.NN) gets a GitHub release, which makes its tag vN.NN, with its built game
  # attached (red-cap-vN.NN.html: one file that plays offline), so any version is one download away. Done here because Claude's
  # cloud sessions cannot push tags. Only the commit just pushed: CI's own token may not tag an older commit whose workflow
  # file differs from main's (GitHub answers "Resource not accessible by integration").
  versions:
    if: github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Tag and release this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(git log -1 --format=%s)
          echo "$v" | grep -qE '^[0-9]+\.[0-9]{2}$' || { echo "not a version commit: nothing to tag"; exit 0; }
          gh release view "v$v" >/dev/null 2>&1 && { echo "v$v is already released"; exit 0; }
          python3 game/build.py
          cp game/red-cap.html "red-cap-v$v.html"
          notes=$(awk -v h="## $v " 'index($0, h) == 1 {f = 1; next} /^## / {f = 0} f' docs/HISTORY.md)
          gh release create "v$v" "red-cap-v$v.html" --target "$GITHUB_SHA" --title "$v" --notes "${notes:-Version $v}"
