name: Build, check and deploy

# Every push to main: build the single-file game, run the quick checks, publish it on GitHub Pages.
# Pull requests: the same build and checks, no deploy.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # the same versions the cloud sessions use (tools/ and tests/ load them from the global npm root; acorn comes with eslint)
      - name: Install checking tools
        run: |
          npm install -g eslint@10.1.0 prettier@3.8.1 playwright@1.63.0
          playwright install --with-deps chromium

      # the same checks as a session's tools/check.sh: format (check only), build, lint, unused names, boot
      - name: Build and check
        run: tools/check.sh ci

      - name: Prepare site
        run: |
          mkdir _site
          cp game/red-cap.html _site/index.html

      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Every version (a commit whose subject is exactly N.NN) gets a GitHub release, which makes its tag vN.NN, with its built game
  # attached (red-cap-vN.NN.html: one file that plays offline), so any version is one download away. Done here because Claude's
  # cloud sessions cannot push tags. CI's own token may only tag a commit whose workflow file matches main's: a new version
  # (the commit just pushed) always can; an older one GitHub refuses is left with a warning. Versions before 1.13 get a release
  # without the file: they can no longer be built.
  versions:
    if: github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tag and release every version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log --reverse --format='%H %s' | grep -E '^[0-9a-f]{40} [0-9]+\.[0-9]{2}$' | while read -r sha v; do
            gh release view "v$v" >/dev/null 2>&1 && continue
            notes=$(awk -v h="## $v " 'index($0, h) == 1 {f = 1; next} /^## / {f = 0} f' docs/HISTORY.md)
            file=
            if tools/build-at.sh "$v" >/dev/null 2>&1; then
              cp "out/red-cap-$v.html" "out/red-cap-v$v.html"
              file="out/red-cap-v$v.html"
            else
              notes="${notes:-Version $v}

          This version can no longer be built (its pictures are no longer in the history): no game file."
            fi
            gh release create "v$v" $file --target "$sha" --title "$v" --notes "${notes:-Version $v}" ||
              echo "::warning::v$v: GitHub refused its release (CI's token cannot tag a commit whose workflow differs from main's)"
          done
