name: Build, check and deploy

# Every push to main: build the single-file game, run the quick checks, publish it on GitHub Pages.
# Pull requests: the same build and checks, no deploy.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # the same versions the cloud sessions use (tools/ and tests/ load them from the global npm root; acorn comes with eslint)
      - name: Install checking tools
        run: |
          npm install -g eslint@10.1.0 prettier@3.8.1 playwright@1.63.0
          playwright install --with-deps chromium

      # the same checks as a session's tools/check.sh: format (check only), build, lint, unused names, boot
      - name: Build and check
        run: tools/check.sh ci

      - name: Prepare site
        run: |
          mkdir _site
          cp game/red-cap.html _site/index.html

      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
